<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 60">

  <!-- Cuerpo transistor, centrado verticalmente en 60px de alto -->
  <!-- Ocupa de y=6 a y=54, dejando 6px arriba y abajo -->
  <rect x="8" y="6" width="38" height="44" rx="7" fill="#8B5E3C" stroke="#C8922A" stroke-width="1.2"/>

  <!-- Rejilla altavoz -->
  <rect x="12" y="12" width="24" height="20" rx="4" fill="none" stroke="#C8922A" stroke-width="0.8" opacity="0.5"/>
  <line x1="13" y1="17" x2="35" y2="17" stroke="#1A0F07" stroke-width="1" opacity="0.6"/>
  <line x1="13" y1="21" x2="35" y2="21" stroke="#1A0F07" stroke-width="1" opacity="0.6"/>
  <line x1="13" y1="25" x2="35" y2="25" stroke="#1A0F07" stroke-width="1" opacity="0.6"/>
  <line x1="13" y1="29" x2="35" y2="29" stroke="#1A0F07" stroke-width="1" opacity="0.6"/>

  <!-- Dial sintonizador -->
  <circle cx="27" cy="42" r="7" fill="#1A0F07" stroke="#C8922A" stroke-width="1.2"/>
  <circle cx="27" cy="42" r="3.5" fill="none" stroke="#D46E2A" stroke-width="0.8"/>
  <circle cx="27" cy="36.5" r="1.5" fill="#D46E2A"/>

  <!-- LED encendido -->
  <circle cx="37" cy="13" r="3.5" fill="#4CAF82" opacity="0.9"/>
  <circle cx="37" cy="13" r="1.8" fill="#fff" opacity="0.5"/>

  <!-- Antena -->
  <line x1="42" y1="6" x2="52" y2="0" stroke="#C8922A" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="52.5" cy="0" r="2.5" fill="#D46E2A"/>

  <!-- Patas -->
  <line x1="16" y1="50" x2="16" y2="57" stroke="#C8922A" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="27" y1="50" x2="27" y2="57" stroke="#C8922A" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="38" y1="50" x2="38" y2="57" stroke="#C8922A" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Separador vertical entre icono y texto -->
  <line x1="58" y1="10" x2="58" y2="50" stroke="#C8922A" stroke-width="0.8" opacity="0.3"/>

  <!-- Texto "Mi" -->
  <text x="68" y="24" font-family="Georgia, serif" font-size="14" font-weight="400" fill="#C8922A" letter-spacing="3">Mi</text>

  <!-- Texto "Transistor" -->
  <text x="66" y="48" font-family="Georgia, serif" font-size="26" font-weight="700" fill="#F5ECD7" letter-spacing="0.5">Transistor</text>

</svg>
